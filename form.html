<!-- form.html -->
<form action="api/web-lead-submission.php" method="POST" id="contactForm">
  <div class="row">
    <input type="hidden" name="page" value="" id="formPageName" />

    <div class="col-12">
      <div class="form-group mb-3">
        <label for="name" class="mb-2">Name*</label>
        <input
          type="text"
          class="form-control"
          id="first-name"
          placeholder="Enter Your Name"
          name="name"
          required
        />
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group mb-3">
        <label for="email" class="mb-2">Email*</label>
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="Enter Your Email"
          name="email"
          required
        />
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group mb-3">
        <label for="phone" class="mb-2">Contact Number</label>
        <input
          type="tel"
          class="form-control"
          id="phone"
          placeholder="+91 Phone No. With Country Code"
          name="phone"
        />
      </div>
    </div>

    <div class="col-12">
      <label for="message" class="mb-2">Message</label>
      <textarea
        name="message"
        id="animatedTextarea"
        placeholder="Enter Your Message"
        rows="4"
        class="form-control"
      ></textarea>
    </div>
  </div>

  <div class="row d-flex justify-content-center mt-4">
    <div class="col-md-6 mb-2">
      <button type="submit" class="home-cta-btn w-100" id="submitBtn">
        Request a Call Back
      </button>
    </div>
    <div class="col-md-6 mb-2">
      <a href="#" target="_blank" id="scheduleLink">
        <button type="button" class="home-cta-btn w-100" id="scheduleBtn">
          Schedule an Instant Call
        </button>
      </a>
    </div>
  </div>
</form>
